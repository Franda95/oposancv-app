  <!-- Google Analytics 4 + Consent Mode -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    const oposancvParams = new URLSearchParams(window.location.search);
    const oposancvConsent = oposancvParams.get('oposancv_consent');

    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      wait_for_update: 500
    });

    if (oposancvConsent === 'accepted') {
      gtag('consent', 'update', {
        analytics_storage: 'granted',
        ad_storage: 'granted',
        ad_user_data: 'granted',
        ad_personalization: 'granted'
      });
    }

    gtag('js', new Date());
    gtag('config', 'G-2X25XMDGD5');
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2X25XMDGD5"></script>

  <!-- Track a registration only after Supabase confirms a successful sign-up. -->
  <script>
    (function() {
      const originalFetch = window.fetch.bind(window);
      let signupTracked = false;

      window.fetch = async function(input, init) {
        const response = await originalFetch(input, init);

        try {
          const url = typeof input === 'string'
            ? input
            : (input && input.url ? input.url : '');

          const isSignupRequest = url.includes('/auth/v1/signup');

          if (isSignupRequest && response.ok && !signupTracked) {
            signupTracked = true;

            const params = new URLSearchParams(window.location.search);
            const eventParams = {
              method: 'email',
              source: params.get('utm_source') || undefined,
              medium: params.get('utm_medium') || undefined,
              campaign: params.get('utm_campaign') || undefined,
              content: params.get('utm_content') || undefined
            };

            if (typeof window.gtag === 'function') {
              window.gtag('event', 'sign_up', eventParams);
            }
          }
        } catch (_) {}

        return response;
      };
    })();
  </script>
